[project]
name = "soundpack-builder"
version = "0.1.0"
description = "Soundpack builder: search_hints → candidates → downloader → templates → validate (see soundpack_builder.workflow)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy<2.3; platform_system == 'Windows'",
  "numpy; platform_system != 'Windows'",
  "faster-whisper",
  "python-dotenv",
  "typing-extensions>=4.0",
  "sentence-transformers>=2.6.0",
  "transformers>=4.46.0,<4.50.0",
  "torch>=2.4.0,<2.6.0",
]

[tool.uv]
package = false

